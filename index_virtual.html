<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Semanal · Registro · Nombre · Entrada · Recarga · Venta · Adicional · Salida</title>
  <style>
    :root {
      --bg: #121317;
      --card: #1B1A1F;
      --text: #EDEDEE;
      --muted: #B3B3B7;
      --radius: 8px;
      --shadow: 0 10px 25px rgba(0,0,0,.35);
      --primary: #4CAF50;
      --btn-dark: #25242A;
      --border-light: rgba(255,255,255,.12);
      --border-med: #333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      padding: 1.5rem;
    }

    .dark-panel {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
      width: 100%;
      max-width: 1400px;
    }

    .blocks-container {
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .blocks-container::-webkit-scrollbar {
      width: 6px;
    }

    .blocks-container::-webkit-scrollbar-track {
      background: #25242A;
      border-radius: 10px;
    }

    .blocks-container::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .block {
      margin-bottom: 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius);
      padding: 0.6rem;
      border: 1px solid var(--border-med);
    }

    .block-header {
      margin-bottom: 0.5rem;
      padding-bottom: 0.3rem;
      border-bottom: 1.5px solid var(--primary);
      display: flex;
      justify-content: flex-start;
    }

    .block-date {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--primary);
      background: var(--btn-dark);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      display: inline-block;
    }

    .global-titles {
      display: grid;
      grid-template-columns: 55px repeat(6, 1fr);
      gap: 0.4rem;
      margin-bottom: 0.5rem;
      background: var(--btn-dark);
      border-radius: var(--radius);
      padding: 0.3rem;
    }

    .title-badge {
      background: transparent;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .row-cells {
      display: grid;
      grid-template-columns: 55px repeat(6, 1fr);
      gap: 0.4rem;
      margin-bottom: 0.4rem;
    }

    .cell {
      background: #121317;
      border-radius: 6px;
      text-align: center;
      border: 1px solid var(--border-med);
      overflow: hidden;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell-predefined {
      background: #1F1E24;
      border-left: 2px solid var(--primary);
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--text);
    }

    .cell-disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    input.cell-input {
      width: 100%;
      height: 100%;
      min-height: 36px;
      background: transparent;
      border: none;
      text-align: center;
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.3rem;
      border-radius: 6px;
      outline: none;
      font-family: inherit;
    }

    input.cell-input:focus {
      outline: 2px solid var(--primary);
      background: rgba(76, 175, 80, 0.1);
    }

    input.cell-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .controls-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .date-input-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--btn-dark);
      padding: 0.4rem 1rem;
      border-radius: 40px;
      border: 1px solid var(--border-light);
    }

    .date-input-wrapper label {
      color: var(--text);
      font-weight: 500;
      font-size: 0.85rem;
    }

    .date-input-wrapper input {
      background: var(--card);
      border: 1px solid var(--primary);
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .week-finish-btn {
      background: var(--btn-dark);
      border: 1.5px solid var(--primary);
      border-radius: 40px;
      padding: 0.6rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .week-finish-btn:hover:not(:disabled) {
      background: var(--primary);
      color: var(--card);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
    }

    .week-finish-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
<div class="dark-panel" id="panelToCapture">
  <div class="blocks-container" id="blocksContainer"></div>
</div>

<div class="controls-wrapper">
  <div class="date-input-wrapper">
    <label>📅 Inicio semana:</label>
    <input type="date" id="startDateInput">
  </div>
  <button class="week-finish-btn" id="finishWeekBtn" disabled>📄 Finalizar semana</button>
</div>

<script src="js/html2canvas.min.js"></script>
<script src="js/jspdf.umd.min.js"></script>

<script>
  const columnTitles = ["Nombre", "Entrada", "Recarga", "Venta", "Adicional", "Salida"];
  let blocksData = [];
  let hasValidDate = false;
  
  function formatDate(date) {
    if(!date) return "Sin fecha";
    const d = String(date.getDate()).padStart(2,'0');
    const m = String(date.getMonth()+1).padStart(2,'0');
    const y = date.getFullYear();
    return `${d}/${m}/${y}`;
  }
  
  function formatDateForFilename(date) {
    const d = String(date.getDate()).padStart(2,'0');
    const m = String(date.getMonth()+1).padStart(2,'0');
    const y = date.getFullYear();
    return `${d}_${m}_${y}`;
  }
  
  function addDays(date, days) {
    const r = new Date(date);
    r.setDate(r.getDate()+days);
    return r;
  }
  
  function getSubscript(n) {
    const subs = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
    return 'T' + n.toString().split('').map(c=>subs[c]||c).join('');
  }
  
  function capitalizeName(value) {
    let cleaned = value.replace(/\s/g, '');
    if (cleaned.length === 0) return '';
    return cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
  }
  
  function formatNumberWithDots(value) {
    if (value === '' || value === null || value === undefined) return '';
    const numStr = String(value).replace(/\./g, '');
    // Permitir el signo negativo al inicio
    const isNegative = numStr.startsWith('-');
    const cleanNum = isNegative ? numStr.substring(1) : numStr;
    if (!/^\d*$/.test(cleanNum)) return value;
    if (cleanNum === '') return isNegative ? '-' : '';
    const num = parseInt(cleanNum, 10);
    if (isNaN(num)) return '';
    const formatted = num.toLocaleString('es-AR');
    return isNegative ? '-' + formatted : formatted;
  }
  
  function cleanNumber(value) {
    if (value === '' || value === null || value === undefined) return '';
    return String(value).replace(/\./g, '');
  }
  
  function validateLettersOnly(value) {
    return /^[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]*$/.test(value);
  }
  
  function validateNumberWithNegative(value) {
    // Permite números con signo negativo opcional al inicio
    return /^-?\d*$/.test(value);
  }
  
  function clearAllCellsData() {
    for(let blockIdx = 0; blockIdx < 7; blockIdx++) {
      for(let row = 0; row < 3; row++) {
        for(let col = 0; col < 6; col++) {
          localStorage.removeItem(`b${blockIdx}_r${row}_c${col}`);
        }
      }
    }
  }
  
  function updateWeekDates(startDate) {
    blocksData = [];
    for(let i = 0; i < 7; i++) {
      blocksData.push({ date: addDays(startDate, i) });
    }
    saveBlocksStructure();
    renderAllBlocks();
  }
  
  function saveBlocksStructure() {
    const structure = blocksData.map(block => ({
      dateStr: block.date ? formatDate(block.date) : null
    }));
    localStorage.setItem('blocksStructure', JSON.stringify(structure));
  }
  
  function loadBlocksStructure() {
    const saved = localStorage.getItem('blocksStructure');
    if(saved) {
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed) && parsed.length === 7) {
        blocksData = parsed.map(item => {
          if(item.dateStr && item.dateStr !== "Sin fecha") {
            const parts = item.dateStr.split('/');
            if(parts.length === 3) {
              return { date: new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0])) };
            }
          }
          return { date: null };
        });
        return true;
      }
    }
    return false;
  }
  
  function createCellInput(colIndex, initialValue, blockIdx, rowIdx, colIdx, enabled) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'cell-input';
    input.disabled = !enabled;
    
    if (colIndex > 0 && initialValue) {
      input.value = formatNumberWithDots(initialValue);
    } else if (colIndex === 0 && initialValue) {
      input.value = initialValue;
    } else {
      input.value = '';
    }
    
    const validate = colIndex === 0 ? validateLettersOnly : validateNumberWithNegative;
    let originalCleanValue = colIndex === 0 ? initialValue : cleanNumber(initialValue);
    
    input.addEventListener('input', function() {
      if(!enabled) return;
      const val = this.value;
      if (!validate(val)) {
        this.style.outline = '2px solid #e74c3c';
        this.style.background = 'rgba(231, 76, 60, 0.1)';
      } else {
        this.style.outline = 'none';
        this.style.background = 'transparent';
      }
    });
    
    function applyFormattingAndSave() {
      if(!enabled) return;
      let rawValue = input.value;
      let finalValue = '';
      
      if (colIndex === 0) {
        if (validateLettersOnly(rawValue)) {
          finalValue = capitalizeName(rawValue);
          input.value = finalValue;
        } else {
          finalValue = originalCleanValue || '';
          input.value = finalValue;
        }
      } else {
        // Eliminar puntos para procesar
        const clean = rawValue.replace(/\./g, '');
        if (validateNumberWithNegative(clean)) {
          if (clean !== '' && clean !== '-') {
            finalValue = clean;
            input.value = formatNumberWithDots(clean);
          } else {
            finalValue = '';
            input.value = '';
          }
        } else {
          finalValue = originalCleanValue || '';
          input.value = originalCleanValue ? formatNumberWithDots(originalCleanValue) : '';
        }
      }
      
      localStorage.setItem(`b${blockIdx}_r${rowIdx}_c${colIdx}`, colIndex === 0 ? finalValue : cleanNumber(finalValue));
      originalCleanValue = colIndex === 0 ? finalValue : cleanNumber(finalValue);
      input.style.outline = 'none';
      input.style.background = 'transparent';
    }
    
    input.addEventListener('blur', applyFormattingAndSave);
    input.addEventListener('keydown', function(e) {
      if (!enabled) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        applyFormattingAndSave();
        moveToNextCell(blockIdx, rowIdx, colIdx);
      }
    });
    
    return input;
  }
  
  function moveToNextCell(blockIdx, rowIdx, colIdx) {
    let nextRow = rowIdx;
    let nextCol = colIdx + 1;
    if (nextCol >= 6) {
      nextCol = 0;
      nextRow++;
      if (nextRow >= 3) return;
    }
    const targetCell = document.querySelector(`.cell[data-block="${blockIdx}"][data-row="${nextRow}"][data-col="${nextCol}"]`);
    if (targetCell) {
      const targetInput = targetCell.querySelector('input');
      if (targetInput) { targetInput.focus(); targetInput.select(); }
    }
  }
  
  function getCellsHTML(rowIndex, blockIndex) {
    let html = '';
    for (let col = 0; col < 6; col++) {
      html += `<div class="cell" data-block="${blockIndex}" data-row="${rowIndex}" data-col="${col}"></div>`;
    }
    return html;
  }
  
  function getRowHTML(rowNum, rowIndex, blockIndex) {
    return `
      <div class="row-cells">
        <div class="cell cell-predefined">${getSubscript(rowNum)}</div>
        ${getCellsHTML(rowIndex, blockIndex)}
      </div>
    `;
  }
  
  function getGlobalTitlesHTML() {
    return `
      <div class="global-titles">
        <div class="title-badge"></div>
        ${columnTitles.map(t => `<div class="title-badge">${t}</div>`).join('')}
      </div>
    `;
  }
  
  function renderAllBlocks() {
    const container = document.getElementById('blocksContainer');
    if(!container) return;
    let html = '';
    for(let i=0; i<blocksData.length; i++) {
      const dateStr = formatDate(blocksData[i].date);
      const showTitles = (i === 0);
      let inner = '';
      if(showTitles) inner += getGlobalTitlesHTML();
      for(let r=0; r<3; r++) {
        inner += getRowHTML(r+1, r, i);
      }
      html += `
        <div class="block">
          <div class="block-header">
            <span class="block-date">📆 ${dateStr}</span>
          </div>
          ${inner}
        </div>
      `;
    }
    container.innerHTML = html;
    attachInputEvents();
  }
  
  function attachInputEvents() {
    for(let blockIdx=0; blockIdx<blocksData.length; blockIdx++) {
      for(let row=0; row<3; row++) {
        for(let col=0; col<6; col++) {
          const cell = document.querySelector(`.cell[data-block="${blockIdx}"][data-row="${row}"][data-col="${col}"]`);
          if(cell && !cell.hasAttribute('data-converted')) {
            const savedValue = localStorage.getItem(`b${blockIdx}_r${row}_c${col}`) || '';
            const input = createCellInput(col, savedValue, blockIdx, row, col, hasValidDate);
            cell.innerHTML = '';
            cell.appendChild(input);
            cell.setAttribute('data-converted', 'true');
          }
        }
      }
    }
  }
  
  async function finishWeekAndGeneratePDF() {
    if(!hasValidDate) {
      alert('Primero debes ingresar una fecha de inicio de semana');
      return;
    }
    
    const firstDate = blocksData[0].date;
    const lastDate = blocksData[6].date;
    
    if(!confirm(`¿Estás seguro?\n\nSe generará un PDF de la semana (${formatDate(firstDate)} al ${formatDate(lastDate)})\n\nLuego se borrarán los datos.`)) {
      return;
    }
    
    const panel = document.getElementById('panelToCapture');
    const container = document.getElementById('blocksContainer');
    const originalMaxHeight = container.style.maxHeight;
    const originalOverflow = container.style.overflow;
    
    container.style.maxHeight = 'none';
    container.style.overflow = 'visible';
    
    try {
      const btn = document.getElementById('finishWeekBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Generando PDF...';
      btn.disabled = true;
      
      await new Promise(resolve => setTimeout(resolve, 100));
      
      const canvas = await html2canvas(panel, {
        scale: 1.5,
        backgroundColor: '#121317',
        logging: false,
        useCORS: false,
        allowTaint: false
      });
      
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });
      
      const pageWidth = 210;
      const pageHeight = 297;
      const margin = 10;
      
      const imgWidth = pageWidth - (margin * 2);
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      
      let finalHeight = imgHeight;
      let finalWidth = imgWidth;
      let startY = margin;
      
      if (imgHeight > pageHeight - (margin * 2)) {
        const scaleFactor = (pageHeight - (margin * 2)) / imgHeight;
        finalHeight = imgHeight * scaleFactor;
        finalWidth = imgWidth * scaleFactor;
        startY = margin;
      }
      
      const startX = (pageWidth - finalWidth) / 2;
      
      pdf.addImage(imgData, 'PNG', startX, startY, finalWidth, finalHeight);
      
      const filename = `${formatDateForFilename(firstDate)}_a_${formatDateForFilename(lastDate)}.pdf`;
      pdf.save(filename);
      
      clearAllCellsData();
      blocksData = [];
      for(let i = 0; i < 7; i++) blocksData.push({ date: null });
      hasValidDate = false;
      saveBlocksStructure();
      
      document.getElementById('startDateInput').value = '';
      document.getElementById('finishWeekBtn').disabled = true;
      
      renderAllBlocks();
      
      btn.innerHTML = originalText;
      btn.disabled = false;
      
    } catch(error) {
      console.error('Error:', error);
      alert('Error al generar el PDF: ' + error.message);
    } finally {
      container.style.maxHeight = originalMaxHeight;
      container.style.overflow = originalOverflow;
    }
  }
  
  function onDateChange(e) {
    const dateValue = e.target.value;
    if(!dateValue) {
      hasValidDate = false;
      document.getElementById('finishWeekBtn').disabled = true;
      blocksData = [];
      for(let i = 0; i < 7; i++) blocksData.push({ date: null });
      saveBlocksStructure();
      renderAllBlocks();
      return;
    }
    
    const parts = dateValue.split('-');
    const year = parseInt(parts[0]);
    const month = parseInt(parts[1]) - 1;
    const day = parseInt(parts[2]);
    
    const startDate = new Date(year, month, day);
    
    if(isNaN(startDate.getTime())) return;
    
    clearAllCellsData();
    hasValidDate = true;
    updateWeekDates(startDate);
    document.getElementById('finishWeekBtn').disabled = false;
  }
  
  function initialize() {
    blocksData = [];
    for(let i = 0; i < 7; i++) blocksData.push({ date: null });
    hasValidDate = false;
    
    const loaded = loadBlocksStructure();
    if(loaded && blocksData[0] && blocksData[0].date) {
      hasValidDate = true;
      document.getElementById('finishWeekBtn').disabled = false;
      const dateInput = document.getElementById('startDateInput');
      if(dateInput && blocksData[0].date) {
        const y = blocksData[0].date.getFullYear();
        const m = String(blocksData[0].date.getMonth() + 1).padStart(2, '0');
        const d = String(blocksData[0].date.getDate()).padStart(2, '0');
        dateInput.value = `${y}-${m}-${d}`;
      }
    }
    
    renderAllBlocks();
    document.getElementById('startDateInput').addEventListener('change', onDateChange);
    document.getElementById('finishWeekBtn').addEventListener('click', finishWeekAndGeneratePDF);
  }
  
  initialize();
</script>
</body>
  </html>
